<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pricing & Premium — FitPulse</title>
<meta name="description" content="FitPulse Free, Monthly and Yearly premium plans — AI coach, meal plans and advanced analytics." />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-footer="on">
<main class="page"><div class="container stack">
  <div class="center" style="max-width:600px;margin-inline:auto"><span class="eyebrow">Pricing</span><h1 style="margin:16px 0 10px;font-size:clamp(2rem,4vw,3rem)">Simple plans. Cancel anytime.</h1><p class="lead">Core tracking is free forever. Premium adds a coach that knows your data.</p></div>
  <div class="card card-flat" id="current" style="display:none"></div>
  <div class="grid g3" id="plans"></div>
</div></main>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  const PLANS = [
    { id: "free", name: "Free", price: 0, per: "forever", feats: ["Food, water, sleep & habit tracking", "Workout library", "7-day progress charts"] },
    { id: "monthly", name: "Premium Monthly", price: 199, per: "/ month", feats: ["Everything in Free", "AI Coach — unlimited", "Personal meal plans", "90-day analytics & badges"] },
    { id: "yearly", name: "Premium Yearly", price: 1499, per: "/ year", popular: true, feats: ["Everything in Monthly", "Save 37% vs monthly", "Priority support", "Early access features"] },
  ];
  const u = currentUser();

  async function loadSubscription() {
    let subData = null;
    if (u) {
      const res = await api("/subscription", null, "GET");
      if (res && res.ok) subData = res;
    }

    const isPremium = (subData && subData.plan === "premium") || (u && u.plan === "premium");
    const expiry = subData?.planExpiry || u?.planExpiry;
    const paymentStatus = subData?.paymentStatus || u?.payment;

    if (isPremium) {
      $("#current").style.display = "";
      $("#current").innerHTML = `
        <div class="row-between">
          <div>
            <div class="row" style="gap:8px">
              <strong>FitPulse Premium (${subData?.planType || u?.planType || "Active"})</strong>
              <span class="badge ${paymentStatus === 'cancelled' ? 'badge-warn' : 'badge-ok'}">${paymentStatus === 'cancelled' ? 'Cancels at period end' : 'Active'}</span>
            </div>
            <p class="small muted" style="margin-top:4px">${expiry ? "Access valid until " + fmtDate(expiry) : "Active Subscription"}</p>
          </div>
          ${paymentStatus !== 'cancelled' ? '<button class="btn btn-ghost btn-sm" id="cancel">Cancel premium</button>' : '<span class="small muted">Cancelled</span>'}
        </div>`;

      if ($("#cancel")) {
        $("#cancel").onclick = async () => {
          if (await confirmDialog("Cancel premium?", "Your subscription will not renew, but you'll keep access until your current period ends.", "Cancel Plan")) {
            const cres = await api("/subscription/cancel", {});
            if (cres && cres.ok) {
              toast(cres.message || "Subscription cancelled.");
            } else {
              Store.update((s) => { const x = s.users.find((v) => v.email === u.email); if (x) x.plan = "free"; });
              toast("Moved to Free plan");
            }
            setTimeout(() => location.reload(), 600);
          }
        };
      }

    }

    // Display real invoices / billing history for all users with past purchases
    if (subData?.orders && subData.orders.length) {
      let historyEl = document.getElementById("orderHistory");
      if (!historyEl) {
        historyEl = document.createElement("div");
        historyEl.id = "orderHistory";
        historyEl.className = "card card-pad";
        historyEl.style.marginTop = "24px";
        historyEl.style.marginBottom = "24px";
        $("#plans").parentNode.insertBefore(historyEl, $("#plans"));
      }
      historyEl.innerHTML = `
        <h3 style="margin-bottom:12px">Payment & Billing History</h3>
        <div class="table-wrap">
          <table class="tbl">
            <thead><tr><th>Receipt / Order ID</th><th>Amount</th><th>Method</th><th>Date</th><th>Status</th></tr></thead>
            <tbody>
              ${subData.orders.map(o => `
                <tr>
                  <td><code>${o.id}</code></td>
                  <td><strong>₹${o.amount}</strong></td>
                  <td>${o.payment_method || o.method || "Online"}</td>
                  <td>${fmtDate(o.created_at)}</td>
                  <td><span class="badge ${o.status === 'paid' ? 'badge-ok' : 'badge-muted'}">${o.status}</span></td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>`;
    }

    $("#plans").innerHTML = PLANS.map((p) => `<div class="card price-card ${p.popular ? "popular" : ""}">
      ${p.popular ? '<span class="badge" style="justify-self:start">Most popular</span>' : ""}
      <h3>${p.name}</h3><div><span class="price-amount">₹${p.price}</span> <span class="muted">${p.per}</span></div>
      <ul class="price-list">${p.feats.map((f) => `<li>${ICONS.check}<span>${f}</span></li>`).join("")}</ul>
      ${p.id === "free" ? `<a href="${u ? "dashboard.html" : "register.html"}" class="btn btn-ghost">${u ? "Current basics" : "Start free"}</a>` : `<a href="checkout.html?plan=${p.id}" class="btn">Choose ${p.name}</a>`}
    </div>`).join("");
  }

  loadSubscription();
</script>
</body>
</html>
