<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard — FitPulse</title>
<meta name="description" content="Your daily FitPulse score, calories, macros, water, steps and sleep at a glance." />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<main class="page"><div class="container stack">
  <div class="row-between">
    <div><p class="muted small" id="dateLine"></p><h2 id="hello">Hello</h2></div>
    <div class="row"><a href="nutrition.html" class="btn btn-sm">+ Log food</a><a href="workouts.html" class="btn btn-sm btn-ghost">Start workout</a></div>
  </div>

  <div class="grid g-side">
    <div class="card card-pad-lg">
      <div class="card-title"><h3>Today's pulse</h3><span class="badge" id="scoreBadge"></span></div>
      <div class="row" style="gap:28px;flex-wrap:wrap;justify-content:space-around" id="rings"></div>
    </div>
    <div class="card">
      <div class="card-title"><h3>Macros</h3><a href="nutrition.html" class="small" style="color:var(--accent)">Details →</a></div>
      <div class="stack" id="macros"></div>
    </div>
  </div>

  <div class="grid g4" id="tiles"></div>

  <div class="grid g-side">
    <div class="card"><div class="card-title"><h3>Calories — last 7 days</h3></div><div class="chart-box chart-box-sm"><canvas id="calChart"></canvas></div></div>
    <div class="card"><div class="card-title"><h3>Today's habits</h3><a href="habits.html" class="small" style="color:var(--accent)">All →</a></div><div class="stack" id="habits" style="gap:10px"></div></div>
  </div>

  <div class="grid g2">
    <div class="card"><div class="card-title"><h3>Recent workouts</h3><a href="workouts.html" class="small" style="color:var(--accent)">Library →</a></div><div class="list" id="recent"></div></div>
    <div class="card card-accent"><h3>Coach tip</h3><p id="tip" style="margin:10px 0 18px"></p><a href="ai-coach.html" class="btn btn-dark btn-sm">Ask the coach</a></div>
  </div>
</div></main>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
if (requireAuth()) {
  const p = getUserProfile(), t = getTargets(), n = getNutrition().totals;
  const water = getWater().total, steps = getSteps(), sleep = getSleep(), score = healthScore();
  const streak = habitStreak();
  $("#hello").textContent = "Hello, " + (p.name || "athlete").split(" ")[0];
  $("#dateLine").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  $("#scoreBadge").textContent = score >= 75 ? "Excellent" : score >= 50 ? "On track" : "Needs attention";
  $("#rings").innerHTML =
    ringHTML({ value: score, max: 100, size: 140, label: "Score", display: score }) +
    ringHTML({ value: n.calories, max: t.calories, size: 140, label: "kcal", display: n.calories.toLocaleString(), sub: "of " + t.calories }) +
    ringHTML({ value: water, max: t.water, size: 140, label: "Water", display: (water / 1000).toFixed(1) + "L" });
  $("#macros").innerHTML = [["Protein", n.protein, t.protein], ["Carbs", n.carbs, t.carbs], ["Fat", n.fat, t.fat], ["Fibre", n.fiber, t.fiber]]
    .map(([l, v, m]) => `<div class="metric"><div class="metric-top"><span>${l}</span><span>${v} / ${m} g</span></div><div class="bar"><i data-pct="${(v / m) * 100}"></i></div></div>`).join("");
  const prog = getProgress();
  $("#tiles").innerHTML = [
    ["Steps", steps.toLocaleString(), `${Math.round((steps / t.steps) * 100)}% of 10k`],
    ["Sleep", sleep ? sleep.hours + " h" : "—", sleep ? `${sleep.bedtime} → ${sleep.wake}` : "Log last night"],
    ["Weight", prog.current + " kg", `${prog.lost >= 0 ? "−" : "+"}${Math.abs(prog.lost)} kg since start`],
    ["Streak", streak + " days", "3+ habits a day"],
  ].map(([l, v, d]) => `<div class="card stat-tile"><span class="label">${l}</span><span class="stat-value">${v}</span><span class="delta">${d}</span></div>`).join("");

  const h = getHabits();
  $("#habits").innerHTML = HABITS.slice(0, 5).map((x) => `<div class="habit-tile ${h[x.id] ? "done" : ""}" data-h="${x.id}"><span class="habit-check">${ICONS.check}</span><span>${x.icon} ${x.name}</span></div>`).join("");
  $$("[data-h]").forEach((el) => el.onclick = () => { toggleHabit(el.dataset.h); el.classList.toggle("done"); });

  const ws = getWorkoutHistory().slice(0, 4);
  $("#recent").innerHTML = ws.length ? ws.map((w) => `<div class="list-item"><div class="li-icon">${ICONS.workout}</div><div style="flex:1"><div class="li-title">${escapeHtml(w.name)}</div><div class="li-sub">${fmtDate(w.date)} · ${w.minutes} min</div></div><span class="badge">${w.calories} kcal</span></div>`).join("") : `<div class="empty">No workouts yet.</div>`;

  const tips = [];
  if (n.protein < t.protein * 0.7) tips.push(`You're ${t.protein - n.protein} g short on protein. Add curd, paneer, dal or eggs to your next meal.`);
  if (water < t.water * 0.6) tips.push(`Hydration is at ${Math.round((water / t.water) * 100)}%. Two glasses in the next hour gets you back on pace.`);
  if (!sleep || sleep.hours < 7) tips.push("Aim for 7+ hours tonight — recovery drives tomorrow's performance.");
  $("#tip").textContent = tips[0] || "Everything's on track. Keep the streak alive with a short walk after dinner.";

  const days = lastNDays(7);
  lineChart($("#calChart"), days.map((d) => new Date(d).toLocaleDateString(undefined, { weekday: "short" })),
    [{ label: "Calories", data: days.map((d) => getNutrition(d).totals.calories) }], { type: "bar" });
  animateRings(); animateBars();
}
</script>
</body>
</html>
