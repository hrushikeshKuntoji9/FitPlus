# ==============================================================================
# FitPulse Pro — Nginx Production Reverse Proxy Configuration
# Domain: fitpulse.app / www.fitpulse.app
# Place in: /etc/nginx/sites-available/fitpulse.app
# Symlink:  sudo ln -s /etc/nginx/sites-available/fitpulse.app /etc/nginx/sites-enabled/
# Test:     sudo nginx -t
# Reload:   sudo systemctl reload nginx
# ==============================================================================

# Rate limiting zone (10 requests per second per IP)
limit_req_zone $binary_remote_addr zone=fitpulse_limit:10m rate=10r/s;

# 1. HTTP Server — Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fitpulse.app www.fitpulse.app;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server — Production Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fitpulse.app www.fitpulse.app;

    # SSL Certificates (managed by Certbot: sudo certbot --nginx -d fitpulse.app -d www.fitpulse.app)
    ssl_certificate /etc/letsencrypt/live/fitpulse.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitpulse.app/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Proxy to FitPulse Flask Server (Port 5000)
    location / {
        limit_req zone=fitpulse_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Health Check bypass without rate limiting
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_set_header Host $host;
    }
}
